# mcap-recorder install config.
#
# `name` — the Zenoh prefix the recorder declares its `command` and `status`
#          queryables under (must be known before any command can be received).
#
# Recordings always land under the storage root, `~/.bubbaloop/recordings/<name>/`,
# so the bubbaloop daemon's storage layer (storage list/info/upload/reconcile/
# replay, the sync driver, the MCP storage_* tools) can find them. The output
# location is no longer configurable; a legacy `output_dir` field, if present, is
# ignored.
#
# Per-session params (`name`, `topic_patterns`, `exclude`, `mode`, `window_secs`,
# the chunking knobs, `decode_timestamps`) are passed in the `start_recording`
# command. See README.md.
name: mcap-recorder
