[workspace]
name = "oak-camera"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[tasks]
main = "python main.py"

[dependencies]
python = ">=3.10"
pip = "*"

[pypi-dependencies]
eclipse-zenoh = ">=1.0"
pyyaml = ">=6.0"
depthai = ">=3.0"
opencv-python = ">=4.8"
numpy = ">=1.24"
cbor2 = ">=5.5"
bubbaloop-sdk = { path = "/home/nvidia/bubbaloop/python-sdk", editable = true }
kornia-rs = { path = "/home/nvidia/kornia-rs/kornia-py", editable = true }
